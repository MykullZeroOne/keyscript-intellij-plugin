name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set Gradle properties for CI
        run: |
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m
          kotlin.stdlib.default.dependency = false
          PROPS

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Create GitHub Release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          ZIP=$(ls build/distributions/*.zip | head -1)

          gh release create "$TAG" "$ZIP" \
            --title "Keyscript IDE $VERSION" \
            --notes "## Keyscript IDE v$VERSION

          ### Install from Custom Repository
          1. **Settings > Plugins > Gear > Manage Plugin Repositories**
          2. Add: \`https://MykullZeroOne.github.io/Jetbrains-Plugins/updatePlugins.xml\`
          3. Search **Keyscript IDE** and click Install

          ### Compatibility
          IntelliJ IDEA / WebStorm 2025.3+ (build 253.x)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger plugin registry rebuild
        if: success()
        continue-on-error: true
        run: |
          gh api repos/MykullZeroOne/Jetbrains-Plugins/dispatches \
            --input - <<< '{"event_type":"plugin-released","client_payload":{"plugin":"keyscript-intellij-plugin"}}'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
